<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DiscGolf Manager{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1e2530;
      --border: #2a3142;
      --accent: #c8f000;
      --accent2: #00e5ff;
      --text: #e8edf4;
      --muted: #6e7a8a;
      --danger: #ff4757;
      --warn: #ffa502;
      --success: #2ed573;
      --eagle: #c8f000;
      --birdie: #00e5ff;
      --bogey: #ff6b6b;
      --double: #ff4757;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      min-height: 100vh;
    }

    /* Nav */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 58px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-brand span { color: var(--text); }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: color 0.15s;
    }
    nav a:hover { color: var(--accent); }
    .nav-right { margin-left: auto; display: flex; gap: 1rem; }

    /* Layout */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 2rem;
    }
    .page-header {
      margin-bottom: 2rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.8rem;
      letter-spacing: 2px;
      line-height: 1;
      color: var(--text);
    }
    h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 1.5px;
      color: var(--text);
      margin-bottom: 1rem;
    }
    h3 {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .card-link {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      text-decoration: none;
      color: var(--text);
      display: block;
      transition: border-color 0.15s, transform 0.15s;
    }
    .card-link:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 1px;
      margin-bottom: 0.3rem;
    }
    .card-meta { color: var(--muted); font-size: 0.83rem; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-primary { background: var(--accent); color: #0d1117; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.78rem; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--text); }

    /* Forms */
    .form-group { margin-bottom: 1.2rem; }
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    input[type=text], input[type=number], input[type=date], textarea, select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      padding: 0.6rem 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .checkbox-item input { width: auto; }

    /* Tables */
    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; }
    th {
      background: var(--surface2);
      padding: 0.7rem 1rem;
      text-align: left;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }
    .td-mono { font-family: 'DM Mono', monospace; font-size: 0.85rem; }

    /* Score chips */
    .score-chip {
      display: inline-block;
      min-width: 28px;
      padding: 2px 6px;
      text-align: center;
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .score-eagle { background: rgba(200,240,0,0.2); color: var(--eagle); border: 1px solid rgba(200,240,0,0.4); }
    .score-birdie { background: rgba(0,229,255,0.15); color: var(--birdie); border: 1px solid rgba(0,229,255,0.3); }
    .score-par { background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid var(--border); }
    .score-bogey { background: rgba(255,107,107,0.15); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.3); }
    .score-double { background: rgba(255,71,87,0.2); color: var(--double); border: 1px solid rgba(255,71,87,0.4); }

    /* To-par display */
    .to-par { font-family: 'DM Mono', monospace; font-weight: 500; }
    .to-par.neg { color: var(--accent); }
    .to-par.pos { color: var(--danger); }
    .to-par.even { color: var(--muted); }

    /* Category badges */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .badge-MPO { background: rgba(200,240,0,0.15); color: var(--accent); border: 1px solid rgba(200,240,0,0.3); }
    .badge-FPO { background: rgba(255,105,180,0.15); color: #ff69b4; border: 1px solid rgba(255,105,180,0.3); }
    .badge-MA3 { background: rgba(0,229,255,0.12); color: var(--accent2); border: 1px solid rgba(0,229,255,0.25); }
    .badge-FA3 { background: rgba(255,165,2,0.15); color: var(--warn); border: 1px solid rgba(255,165,2,0.3); }
    .badge-MJ18 { background: rgba(46,213,115,0.12); color: var(--success); border: 1px solid rgba(46,213,115,0.25); }

    /* Alerts */
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .alert-success { background: rgba(46,213,115,0.1); border: 1px solid rgba(46,213,115,0.3); color: var(--success); }
    .alert-info { background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.25); color: var(--accent2); }
    .alert-danger { background: rgba(255,71,87,0.1); border: 1px solid rgba(255,71,87,0.25); color: var(--danger); }

    /* Misc */
    .divider { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    .text-muted { color: var(--muted); }
    .text-accent { color: var(--accent); }
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; }
    .mb-2 { margin-bottom: 1rem; }
    .flex { display: flex; }
    .gap-1 { gap: 0.5rem; }
    .gap-2 { gap: 1rem; }
    .items-center { align-items: center; }
    .flex-wrap { flex-wrap: wrap; }
    .rank-1 { color: #ffd700; font-weight: 700; }
    .rank-2 { color: #c0c0c0; font-weight: 600; }
    .rank-3 { color: #cd7f32; font-weight: 600; }
    .hole-input {
      width: 60px !important;
      text-align: center;
      padding: 0.5rem 0.3rem !important;
    }
    .par-display {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }
    .section { margin-bottom: 2.5rem; }
    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--muted);
    }
    .empty-state p { margin-top: 0.5rem; font-size: 0.9rem; }
    select option { background: var(--surface2); }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-brand">🥏 <span>Disc</span>Golf</a>
    <a href="/players">Players</a>
    <a href="/course/new">+ Course</a>
    <a href="/event/new">+ Event</a>
  </nav>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ 'success' if cat == 'success' else 'info' if cat == 'info' else 'danger' }} mt-2">
          {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
